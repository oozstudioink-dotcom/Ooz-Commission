# Runs the Ooz Reels approval bot once an hour (and on demand from the Actions tab).
# Needs repo secret TELEGRAM_BOT_TOKEN. Optional: TELEGRAM_OWNER_ID to pin the owner chat.
name: reels-bot

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "run = normal bot run; check = test social connections (posts nothing); tiktok-connect = finish TikTok sign-in; tidy-drive = move duplicate Shorts in Drive to the Trash"
        type: choice
        options: [run, check, tiktok-connect, tidy-drive]
        default: run
      code:
        description: "tiktok-connect only: the code shown on the TikTok connect page"
        type: string
        required: false

permissions:
  contents: write
  actions: write          # lets /longform start the longform workflow

concurrency:
  group: reels-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reels-ai
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Always start from the latest main, so "Re-run" never works from an outdated bot memory.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check social connections (posts nothing)
        if: inputs.task == 'check'
        run: python -m reels_ai bot --phase check

      - name: Tidy Drive (duplicates to the Trash)
        if: inputs.task == 'tidy-drive'
        run: python -m reels_ai bot --phase tidy-drive

      - name: Connect TikTok (one time)
        if: inputs.task == 'tiktok-connect'
        env:
          TIKTOK_AUTH_CODE: ${{ inputs.code }}
        run: python -m reels_ai bot --phase tiktok-connect

      # Fast path: stdlib only. Reads Telegram, handles taps, posts what's due.
      - name: Poll Telegram
        id: poll
        if: inputs.task != 'check' && inputs.task != 'tiktok-connect' && inputs.task != 'tidy-drive'
        run: python -m reels_ai bot --phase poll

      # Slow path, only when a new timelapse arrived.
      - name: Install video tools
        if: steps.poll.outputs.render == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-inter
          pip install -q -r requirements.txt

      - name: Render variants and send for approval
        if: steps.poll.outputs.render == 'true'
        timeout-minutes: 52        # stop in time for "Save bot state" (each finished drawing is already saved)
        run: python -m reels_ai bot --phase render

      - name: Save bot state
        if: always()
        run: |
          git config user.name "ooz-reels-bot"
          git config user.email "ooz-reels-bot@users.noreply.github.com"
          if [ -f state/.in_drive ]; then
            # The bot's memory lives privately in Google Drive now: remove the public repo copy once.
            git ls-files --error-unmatch state/state.json >/dev/null 2>&1 || exit 0
            git rm -q --cached state/state.json
            git commit -q -m "reels-bot: memory moved to Google Drive"
          else
            [ -f state/state.json ] || exit 0
            git add state/state.json
            git diff --cached --quiet && exit 0
            git commit -q -m "reels-bot: update state"
          fi
          # If main moved while we ran, keep this run's state (it is the newest).
          for i in 1 2 3; do
            git fetch -q origin "${{ github.event.repository.default_branch }}" &&
              git rebase -q -X theirs FETCH_HEAD &&
              git push -q origin HEAD:"${{ github.event.repository.default_branch }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "::error::Could not save bot state"; exit 1

      # Tell the owner in Telegram when a run crashes or times out (otherwise it fails silently).
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          ALERT_WHAT: bot run
        run: python -m reels_ai bot --phase alert || true
