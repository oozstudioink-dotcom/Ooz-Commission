# Ooz Reels bot settings. Edit on GitHub; changes apply on the next run.
# The [platforms.*] sections are only used when [delivery] mode = "platforms".

timezone = "America/New_York"   # used for post_times below

[delivery]
# "drops"    : one shuffled feed. At each drop time the bot sends you a variant you haven't had
#              yet (never the same drawing twice in a row) to post yourself with a trending sound.
#              Nothing is auto-posted.
# "platforms": per-platform schedules below, with optional auto-posting (method = "api").
mode = "drops"
drop_times = ["12:00"]               # noon
drop_days = ["Mon", "Wed", "Fri"]    # three Shorts a week; the LongDraw goes up Fridays at noon
# Each day = ONE drawing: the bot sends `options` versions of it to choose from, the caption, and
# a 4:5 still of the finished piece for the Instagram feed post. The drawing is then used up, so
# no drawing is posted twice. split names the platforms the Short goes to.
split = ["tiktok", "youtube", "instagram"]
options = 3
instagram_post = true
# auto_drop = false
youtube_time = "12:00"               # Schedule on YouTube: channel Shorts go public at this time on drop_days: nothing is sent on a schedule. You sort your library with /videos:
# Uploaded (file to Done > Uploaded), Variant (kept for Facebook trial reels once a version of
# that drawing is uploaded), Discard (file to Delete Me). true = the daily drop above.
auto_drop = false
post_to = "TikTok \u00b7 Instagram Reels \u00b7 YouTube Shorts"

[naming]
# A new Drive recording with a camera name (IMG_4412.MOV): the bot sends you a frame from it and
# asks what it is. Reply with a name ("Kakashi - ink only"): it renames the file in Drive and uses
# the name for the Shorts. With no answer in wait_hours, it's made without a name.
ask = true
wait_hours = 12

[approval]
# "approve"        : each variant waits for your Post / Skip tap
# "auto"           : variants go straight into the bank (sent to you as one album per drawing)
# "approve_or_auto": asks you; if you don't answer within fallback_hours, approves anyway
mode = "approve"                 # you tap ✅ / ❌ on every new video; only ✅ ones are dropped
fallback_hours = 6

[variants]
# flow = "primary": each drawing makes ONE Short for your channel in the primary style (sent with
# Uploaded / Redo) plus per_drawing - 1 trial reels for Facebook (Keep / Discard), sent as soon as
# they're made. Drive: Completed Shorts and Trial Reel Shorts. /styles and /primary change it.
flow = "primary"
primary = "rewind"
per_drawing = 5                  # 1 channel Short + 4 trial reels
# The "whole process" family: one locked view of the whole page, first line to last, no zooms,
# wipes or cuts (the edits you liked best were one_take and reveal_first). Styles you can add back:
# "process_cuts", "before_after", "detail_zoom", "ink_only".
styles = ["one_take", "reveal_first", "slow_open", "rewind", "chapters", "last_lines", "speedrun"]

# method = "manual": at post time the bot sends you the finished video + caption to upload
#                    (until the YouTube / Instagram API connections are set up)
# method = "api"   : uploads automatically (Instagram supported; needs the IG_ACCESS_TOKEN secret)
[platforms.youtube]
enabled = true
method = "api"                   # connection check passed 2026-11-07 (Ooz Studio Ink)
privacy = "public"               # YouTube keeps API uploads private until Google's audit is approved
category_id = 1                  # Film & Animation
max_per_day = 1
post_times = ["12:00"]

[platforms.instagram]
# Off since 2026-11-12: Instagram flagged the account for "automated account activity". The bot
# only ever read your own stats through Instagram's official connection (weekly report and
# connection checks; it never posted, liked, followed or commented), but it stays off until the
# flag is cleared. With this off the bot makes no Instagram requests at all.
enabled = false
method = "api"                   # connection check passed 2026-11-07 (@oozstudioink)
ig_user_id = "17841426631544131" # @oozstudioink
share_to_feed = false            # false = Reels tab only, keeps the main grid clean
max_per_day = 1
post_times = ["19:00"]

[platforms.tiktok]
enabled = true
method = "manual"                # switch to "api" once TikTok is connected and the check passes
mode = "inbox"                   # "inbox": draft in your TikTok inbox (add a sound, tap post)
                                 # "direct": post straight away (private until TikTok's app audit)
privacy = "PUBLIC_TO_EVERYONE"
redirect_uri = "https://oozstudioink-dotcom.github.io/Ooz-Commission/tiktok-callback.html"
max_per_day = 1
post_times = ["18:00"]

[watch]
# Ears and eyes. Each Drive recording is watched once: its sound is transcribed on the bot's
# machine (Whisper, free, nothing leaves the run), and Claude looks at a storyboard of frames
# with the transcript and says which pages appear, which is being drawn on, and how many separate
# drawings were made and when. The editor cuts from that; the measurements place the exact frames.
# Needs the ANTHROPIC_API_KEY secret (pay per use: roughly 20 cents for a 35-minute stream,
# a few cents for a short clip). Without the key the editor measures only, as before.
enabled = true
model = "claude-opus-5-5"
# Most Claude may cost in a month, in dollars. At the limit the bot tells you once and finds
# drawings by measuring only until next month. A recording is only ever paid for once: its
# edit map is kept in Drive > Bot memory > Edit maps and reused by /redo and by the test set.
monthly_budget_usd = 15
ears = true
whisper_model = "base"           # "small" hears better but takes about three times as long

[review]
# The reviewer watches every finished Short before it reaches you: too short, stutter, blank
# stretches, or another page in the video. One that fails is replaced by another style; if none
# passes, the drawing is held and you get one message with the reason.
enabled = true
# look: Claude also looks at a few frames of each finished version and adds one line of opinion
# to its message (framing, whole drawing visible, anything distracting). Advice only; about
# 2 cents a drawing, counted in [watch] monthly_budget_usd.
look = true

[shorts]
# "4k": recordings from the Drive inbox render at up to 2160x3840 (vertical 4K; landscape
# recordings as large as their vertical crop allows). Full-quality files go to Drive >
# Done > Shorts and every drop links to them; Telegram gets 1080p previews (50 MB bot limit).
resolution = "4k"
max_render_minutes = 40          # only for one-off runs; the always-on bot has no limit
drop_guard_minutes = 20          # no new drawing is started this close to a drop time, so drops are never late

[drive]
part_wait_minutes = 10           # "Gojo 1", "Gojo 2" in Inbox: wait this long after the last upload, then suggest /combine
# Google Drive inbox for raw recordings (any length, 4K, portrait or landscape).
# Folders are created inside this root on the first `check` run:
#   Inbox/ (drop single-drawing recordings) · Inbox/Processed/ · Longform/ · Beats/
#   Thumbnail Style/ · Side Panels/ · Done/Shorts/ · Done/Longform/
enabled = true
root = "Ooz Reels"
backup_shorts = true             # also save every variant to Done/Shorts/<character>/
shorts_from_longform = true      # sessions in Longform/<project>/ also become Shorts (upload once)
storage_alert_gb = 50            # monthly Telegram note when processed raws exceed this (never deletes)
memory_in_drive = true           # the bot's memory lives privately in Drive > Ooz Reels > Bot memory (not the public repo)

[longform]
# "LongDraw" YouTube videos built from Drive > Longform/<project>/ sessions.
next_episode = 5                 # the lowest number the next LongDraw can get (Afro Samurai = EP 05); counts up from the Done > Longform folders
target_minutes = [20, 30]        # speed is picked so the cut lands in this range
resolution = "4k"                # "4k" (3840x2160) or "1080p"
art_panel_name = "YT_Longform_Finished_Art_Panel"   # optional image in the project folder for the thumbnail
youtube_upload = true            # upload automatically (private; you schedule it in YouTube Studio)
privacy = "private"              # you schedule each LongDraw yourself in YouTube Studio (stays private after the audit too)
music_source = "YouTube Audio Library"   # credited with the track list in each description

[panels]
# Side panels beside vertical recordings in LongDraws. The right panel rotates every
# rotate_minutes: your advert animation (Drive > Ooz Reels > Side Panels), socials, schedule.
rotate_minutes = 5
allow_upscale = false            # never enlarge the advert (keeps it sharp)
link = "https://oozstudioink-dotcom.github.io/Ooz-Commission/"   # your commissions page
socials = [
  ["Instagram", "@oozstudioink1"],
  ["TikTok", "@oozstudioink1"],
  ["YouTube", "Ooz Studio Ink"],
  ["X", "@OozStudioInk"],
  ["Facebook", "Ooz Studio Ink"],
]
schedule_title = "Upload schedule"
schedule = [                     # "MAIN TEXT | small line under it"
  "New Shorts | Mon \u00b7 Wed \u00b7 Fri",
  "Long video | every Friday \u00b7 12 PM EST",
]
# From this date LongDraws show the new rhythm in their side panel (it's part of the video, so the
# switch comes a few days early: LongDraws built from Dec 26 go out in January).
[[panels.schedule_from]]
date = "2026-12-26"
lines = [
  "New Shorts | Mon \u00b7 Wed \u00b7 Fri",
  "Drawing video | Fri \u00b7 12 PM EST",
  "Drawing lesson | every week",
]

[panels.advert]
# "generated": the bot's own sharp recreation of your commissions animation (text below)
# "drive": use the advert video in Drive > Ooz Reels > Side Panels instead · "off": no advert card
source = "generated"
brand = ["OOZ", "STUDIO", "INK"]
headline = ["COMMISSIONS", "OPEN"]
offer = ["FIRST 10 CLIENTS", "50% OFF"]


[ai]
# Never on screen or in captions: words that can read two ways ("stroke" also covers "strokes").
# Add any you dislike; "finished" (the finished piece) is still fine, "the finish" isn't.
avoid_words = ["stroke", "come", "coming", "came", "finish", "satisfying", "go down", "goes down",
               "wet", "thick", "hard", "blow", "climax", "tease"]
# Hooks, captions and hashtags. writer = "claude": Claude writes them from the finished drawing
# (about a cent a drawing, counted in [watch] monthly_budget_usd). If Claude can't (no key, the
# monthly limit, a failure) Gemini is tried when its key is set, and the built-in hooks after that.
enabled = true
writer = "claude"                # or "gemini"
# Routine reading and planning jobs that Gemini's free tier tries first; Claude only steps in when
# Gemini is busy. Jobs not listed go straight to Claude (watching recordings, judging Shorts,
# rewrites, sponsor emails). Take a job off the list if Gemini's answers aren't good enough.
gemini_first = ["radar", "calendar", "sponsors", "about"]
model = "gemini-pro-latest"     # the Gemini model used as the fallback

[bank]
warn_below_days = 3              # Telegram alert when the approved-video bank gets this low
retired = ["Shinobi Undercover", "My Hero Academia"]  # used enough: never dropped or re-made again (matches name or file name)

[radar]
# What to draw next, sent every morning (and on /trends): the characters getting the most views
# in this week's short drawing videos on YouTube, and the characters your viewers asked for in
# comments. Name a recording after a requested character and the caption thanks whoever asked.
enabled = true
hour = 9                         # your time; sent on the first check after this hour
days = 7                         # how far back "this week" looks
queries = ["anime drawing", "manga drawing", "speed drawing anime"]

[audit]
# The channel auditor: every week (and on /audit) the bot measures your recent YouTube videos
# against your own usual pace, says what is working, and proposes new titles, descriptions and
# tags for the weakest ones. A proposal changes nothing until you tap Apply; /undo_rewrite puts
# the last one back. The 7-day content calendar (/calendar) is sent with it.
enabled = true
weekday = 6                      # 0 = Monday ... 6 = Sunday
hour = 11                        # your time
videos = 20                      # how many recent videos are measured
rewrites = 3                     # at most this many rewrites are proposed each time

[sponsors]
# /sponsors: reads the descriptions of the most-viewed drawing videos of the last two months,
# lists the brands that sponsor or supply those creators (each backed by an exact quote), and
# drafts a first email to the top ones from your real numbers. On demand only; nothing is sent.
queries = ["manga drawing", "inking art", "art supplies haul", "japanese brush pen calligraphy", "manga tools review"]
days = 60
videos = 40                      # descriptions read each time
drafts = 3                       # emails drafted
# What the emails say about you. They lead with the work, state your numbers once as they are,
# and ask for an affiliate or discount code or product first, open to any other deal.
about = "Ooz Studio Ink: an artist inking by hand in the manga tradition; sketchbook studies and practice pieces (no published or original series work), posted as inking timelapses and longer real-time sessions"
portfolio = "https://oozstudioink-dotcom.github.io/Ooz-Commission/portfolio.html"
wishlist = ["Japanese calligraphy brushes", "brush pens", "sumi ink", "manga dip pens and nibs", "manga manuscript paper"]

# Series: recordings that belong to a set and get their own folder, lesson numbers and thumbnail.
# Put one of the `match` words in the file name (e.g. "How to Draw - Perspective grids.mov"), drop
# it in Inbox as usual: Shorts are made, then the recording moves to Longform > folder > its name.
# /longform <its name> builds the long video with this series' thumbnail and "Lesson 01" numbering.
# Your own drawing lessons. /longform asks "drawing video or lesson?"; a lesson's folder moves here
# and gets Lesson numbering, the lesson thumbnail and the lesson description. A recording whose
# name has "lesson" or "edu" in it (e.g. "Hands - lesson.MOV") comes straight here with no Shorts.
[[series]]
name = "Studio Lessons"
folder = "Educational Drawing/Studio Lessons"
match = ["lesson", "edu", "educational", "tutorial"]
words = ["DRAWING", "LESSON"]
badge = "LESSON"
kicker = "Drawing lesson"
shorts = false                   # lesson recordings don't become Shorts

[[series]]
name = "How to Draw (Scott Robertson)"
folder = "Educational Drawing/How to Draw - Scott Robertson"
match = ["how to draw", "htd", "robertson"]
words = ["HOW TO", "DRAW"]       # the two big words on the thumbnail and intro
badge = "LESSON"
kicker = "Book study"            # small red tab on the thumbnail

[[series]]
name = "Anatomy for Artists (Tom Fox)"
folder = "Educational Drawing/Anatomy for Artists - Tom Fox"
match = ["anatomy", "tom fox", "form and pose"]
words = ["ANATOMY", "STUDY"]
badge = "LESSON"
kicker = "Book study"

[youtube]
# Every YouTube description is built from these (reels_ai/descriptions.py). LongDraws: welcome
# with the episode, the one-line topic, "About this drawing", the schedule, the commission link,
# your socials, chapters, the songs, hashtags. Shorts: the intro, the schedule, the commission
# link, your socials, hashtags. Full https:// links are clickable in long-video descriptions.
intro = "I'm a comic artist and character designer, and everything I post is drawn and inked by hand."
welcome = "Welcome to {label}! Thanks for hanging out while this one comes together, from the first pencil lines to the final ink."
schedule_title = "Upload schedule (Eastern Time)"
schedule = [
  "New Shorts: Monday, Wednesday and Friday",
  "New long video: every Friday at 12 PM EST",
]
commission_title = "Commissions are open"
commission_link = "https://oozstudioink-dotcom.github.io/Ooz-Commission/"
portfolio_link = "https://oozstudioink-dotcom.github.io/Ooz-Commission/portfolio.html"
dm_title = "DM me for commissions or questions"
socials = [
  ["Instagram", "https://www.instagram.com/oozstudioink1/"],
  ["TikTok", "https://www.tiktok.com/@oozstudioink1"],
  ["Facebook", "https://www.facebook.com/profile.php?id=61596390966478"],
  ["X", "https://x.com/OozStudioInk"],
]

# On this date every new description (and /fixdescriptions) switches to these lines by itself.
[[youtube.schedule_from]]
date = "2027-01-01"
lines = [
  "New Shorts: Monday, Wednesday and Friday",
  "New drawing video: every Friday at 12 PM EST",
  "New drawing lesson: every week",
]

[notion]
# The Content Pipeline in Notion, kept up to date by the bot (reels_ai/notion.py): a Short you tap
# Uploaded on is marked Published; a LongDraw that's built fills the next empty LongDraw slot; LongDraws
# you schedule or publish on YouTube follow by themselves. Needs the NOTION_TOKEN secret (an internal
# integration) and the Content Pipeline shared with that integration. /notion checks the connection.
enabled = true
database_id = "32c0104a-3b9f-8382-92a4-01353b635e74"
data_source_id = "e4a0104a-3b9f-83e0-8a88-07da64220d3a"
sync_hours = 6
