# Ooz Reels bot settings. Edit on GitHub; changes apply on the next run.
# The [platforms.*] sections are only used when [delivery] mode = "platforms".

timezone = "America/New_York"   # used for post_times below

[delivery]
# "drops"    : one shuffled feed. At each drop time the bot sends you a variant you haven't had
#              yet (never the same drawing twice in a row) to post yourself with a trending sound.
#              Nothing is auto-posted.
# "platforms": per-platform schedules below, with optional auto-posting (method = "api").
mode = "drops"
drop_times = ["17:00", "17:00"]      # same time twice = both drops at 5 PM
# Each drop = ONE drawing, with a different version for each platform below, so no platform sees
# the same drawing twice and the platforms test styles against each other. [] = old one-video drops.
split = ["tiktok", "youtube", "instagram"]
post_to = "TikTok \u00b7 Instagram Reels \u00b7 YouTube Shorts"

[naming]
# A new Drive recording with a camera name (IMG_4412.MOV): the bot sends you a frame from it and
# asks what it is. Reply with a name ("Kakashi - ink only"): it renames the file in Drive and uses
# the name for the Shorts. With no answer in wait_hours, it's made without a name.
ask = true
wait_hours = 12

[approval]
# "approve"        : each variant waits for your Post / Skip tap
# "auto"           : variants go straight into the bank (sent to you as one album per drawing)
# "approve_or_auto": asks you; if you don't answer within fallback_hours, approves anyway
mode = "approve"                 # you tap ✅ / ❌ on every new video; only ✅ ones are dropped
fallback_hours = 6

[variants]
per_drawing = 3                  # versions made from each drawing: one per platform in [delivery] split
# The "whole process" family: one locked view of the whole page, first line to last, no zooms,
# wipes or cuts (the edits you liked best were one_take and reveal_first). Styles you can add back:
# "process_cuts", "before_after", "detail_zoom", "ink_only".
styles = ["one_take", "reveal_first", "rewind", "chapters", "last_lines", "speedrun"]

# method = "manual": at post time the bot sends you the finished video + caption to upload
#                    (until the YouTube / Instagram API connections are set up)
# method = "api"   : uploads automatically (Instagram supported; needs the IG_ACCESS_TOKEN secret)
[platforms.youtube]
enabled = true
method = "api"                   # connection check passed 2026-11-07 (Ooz Studio Ink)
privacy = "public"               # YouTube keeps API uploads private until Google's audit is approved
category_id = 1                  # Film & Animation
max_per_day = 1
post_times = ["17:00"]

[platforms.instagram]
enabled = true
method = "api"                   # connection check passed 2026-11-07 (@oozstudioink)
ig_user_id = "17841426631544131" # @oozstudioink
share_to_feed = false            # false = Reels tab only, keeps the main grid clean
max_per_day = 1
post_times = ["19:00"]

[platforms.tiktok]
enabled = true
method = "manual"                # switch to "api" once TikTok is connected and the check passes
mode = "inbox"                   # "inbox": draft in your TikTok inbox (add a sound, tap post)
                                 # "direct": post straight away (private until TikTok's app audit)
privacy = "PUBLIC_TO_EVERYONE"
redirect_uri = "https://oozstudioink-dotcom.github.io/Ooz-Commission/tiktok-callback.html"
max_per_day = 1
post_times = ["18:00"]

[watch]
# Ears and eyes. Each Drive recording is watched once: its sound is transcribed on the bot's
# machine (Whisper, free, nothing leaves the run), and Claude looks at a storyboard of frames
# with the transcript and says which pages appear, which is being drawn on, and how many separate
# drawings were made and when. The editor cuts from that; the measurements place the exact frames.
# Needs the ANTHROPIC_API_KEY secret (pay per use: roughly 20 cents for a 35-minute stream,
# a few cents for a short clip). Without the key the editor measures only, as before.
enabled = true
model = "claude-opus-5-5"
# Most Claude may cost in a month, in dollars. At the limit the bot tells you once and finds
# drawings by measuring only until next month. A recording is only ever paid for once: its
# edit map is kept in Drive > Bot memory > Edit maps and reused by /redo and by the test set.
monthly_budget_usd = 8
ears = true
whisper_model = "base"           # "small" hears better but takes about three times as long

[review]
# The reviewer watches every finished Short before it reaches you: too short, stutter, blank
# stretches, or another page in the video. One that fails is replaced by another style; if none
# passes, the drawing is held and you get one message with the reason.
enabled = true

[shorts]
# "4k": recordings from the Drive inbox render at up to 2160x3840 (vertical 4K; landscape
# recordings as large as their vertical crop allows). Full-quality files go to Drive >
# Done > Shorts and every drop links to them; Telegram gets 1080p previews (50 MB bot limit).
resolution = "4k"
max_render_minutes = 40          # per hourly run; the rest continues next run
drop_guard_minutes = 20          # no new drawing is started this close to a drop time, so drops are never late

[drive]
# Google Drive inbox for raw recordings (any length, 4K, portrait or landscape).
# Folders are created inside this root on the first `check` run:
#   Inbox/ (drop single-drawing recordings) · Inbox/Processed/ · Longform/ · Beats/
#   Thumbnail Style/ · Side Panels/ · Done/Shorts/ · Done/Longform/
enabled = true
root = "Ooz Reels"
backup_shorts = true             # also save every variant to Done/Shorts/<character>/
shorts_from_longform = true      # sessions in Longform/<project>/ also become Shorts (upload once)
storage_alert_gb = 50            # monthly Telegram note when processed raws exceed this (never deletes)
memory_in_drive = true           # the bot's memory lives privately in Drive > Ooz Reels > Bot memory (not the public repo)

[longform]
# "LongDraw" YouTube videos built from Drive > Longform/<project>/ sessions.
next_episode = 2                 # EP. number for the next upload (counts up automatically)
target_minutes = [20, 30]        # speed is picked so the cut lands in this range
resolution = "4k"                # "4k" (3840x2160) or "1080p"
art_panel_name = "YT_Longform_Finished_Art_Panel"   # optional image in the project folder for the thumbnail
youtube_upload = true            # upload automatically (private; you schedule it in YouTube Studio)
privacy = "private"              # you schedule each LongDraw yourself in YouTube Studio (stays private after the audit too)
music_source = "YouTube Audio Library"   # credited with the track list in each description

[panels]
# Side panels beside vertical recordings in LongDraws. The right panel rotates every
# rotate_minutes: your advert animation (Drive > Ooz Reels > Side Panels), socials, schedule.
rotate_minutes = 5
allow_upscale = false            # never enlarge the advert (keeps it sharp)
link = "linktr.ee/oozstudioink"
socials = [
  ["Instagram", "@oozstudioink"],
  ["TikTok", "@oozstudioink1"],
  ["YouTube", "Ooz Studio Ink"],
  ["X", "@OozStudioInk"],
  ["Threads", "@oozstudioink"],
  ["Facebook", "Ooz Studio Ink"],
]
schedule_title = "Upload schedule"
schedule = [                     # "MAIN TEXT | small line under it"
  "New Shorts | every day \u00b7 5 PM EST",
  "LongDraw | every Friday \u00b7 5 PM EST",
]

[panels.advert]
# "generated": the bot's own sharp recreation of your commissions animation (text below)
# "drive": use the advert video in Drive > Ooz Reels > Side Panels instead · "off": no advert card
source = "generated"
brand = ["OOZ", "STUDIO", "INK"]
headline = ["COMMISSIONS", "OPEN"]
offer = ["FIRST 10 CLIENTS", "50% OFF"]


[ai]
# Hooks + captions written by Google Gemini when the GEMINI_API_KEY secret is set
# (free key: aistudio.google.com -> Get API key). Without a key the built-in hooks are used.
enabled = true
model = "gemini-pro-latest"     # best quality; falls back to Flash when Pro is busy or not on the key

[bank]
warn_below_days = 3              # Telegram alert when the approved-video bank gets this low
retired = ["Shinobi Undercover", "My Hero Academia"]  # used enough: never dropped or re-made again (matches name or file name)
