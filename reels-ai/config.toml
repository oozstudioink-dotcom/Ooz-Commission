# Ooz Reels bot settings. Edit on GitHub; changes apply on the next hourly run.

timezone = "America/New_York"   # used for post_times below

[approval]
# "approve"        : nothing posts until you tap Post
# "auto"           : posts without asking (you still get a copy)
# "approve_or_auto": asks you; if you don't answer within fallback_hours, posts anyway
mode = "approve_or_auto"
fallback_hours = 6

[variants]
per_drawing = 2                  # max variants made from each drawing
styles = ["reveal_first", "speedrun", "before_after", "detail_zoom", "ink_only"]

# method = "manual": at post time the bot sends you the finished video + caption to upload
#                    (until the YouTube / Instagram API connections are set up)
# method = "api"   : uploads automatically (Instagram supported; needs the IG_ACCESS_TOKEN secret)
[platforms.youtube]
enabled = true
method = "api"                   # connection check passed 2026-11-07 (Ooz Studio Ink)
privacy = "public"               # YouTube keeps API uploads private until Google's audit is approved
category_id = 1                  # Film & Animation
max_per_day = 1
post_times = ["17:00"]

[platforms.instagram]
enabled = true
method = "api"                   # connection check passed 2026-11-07 (@oozstudioink)
ig_user_id = "17841426631544131" # @oozstudioink
share_to_feed = false            # false = Reels tab only, keeps the main grid clean
max_per_day = 1
post_times = ["19:00"]

[platforms.tiktok]
enabled = true
method = "manual"                # switch to "api" once TikTok is connected and the check passes
mode = "inbox"                   # "inbox": draft in your TikTok inbox (add a sound, tap post)
                                 # "direct": post straight away (private until TikTok's app audit)
privacy = "PUBLIC_TO_EVERYONE"
redirect_uri = "https://oozstudioink-dotcom.github.io/Ooz-Commission/tiktok-callback.html"
max_per_day = 1
post_times = ["18:00"]

[bank]
warn_below_days = 3              # Telegram alert when the approved-video bank gets this low
